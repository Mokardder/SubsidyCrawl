name: Node.js + Chromium + IndianOil portal test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Syntax, Chromium, and IndianOil portal smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Check server.js syntax
        run: node --check server.js

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify headless Chromium
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            let browser;
            try {
              browser = await chromium.launch({ headless: true });
              const page = await browser.newPage();
              const response = await page.goto("https://example.com", {
                waitUntil: "domcontentloaded",
                timeout: 30000
              });

              if (!response || !response.ok()) {
                throw new Error(`Example page returned HTTP ${response && response.status()}`);
              }

              const title = await page.title();
              if (title !== "Example Domain") {
                throw new Error(`Unexpected page title: ${title}`);
              }

              console.log("PASS: Chromium launched and navigated successfully.");
            } finally {
              if (browser) await browser.close();
            }
          })().catch(error => {
            console.error("Chromium smoke test failed:", error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Check IndianOil portal connectivity
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");

          const portalUrl = "https://cx.indianoil.in/EPICIOCL/faces/GrievanceMainPage.jspx";

          (async () => {
            let browser;
            try {
              browser = await chromium.launch({
                headless: true,
                args: ["--no-sandbox", "--disable-dev-shm-usage"]
              });

              const context = await browser.newContext({
                viewport: { width: 1024, height: 768 }
              });
              const page = await context.newPage();
              page.setDefaultNavigationTimeout(90000);

              // Match the crawler's bandwidth-saving behavior.
              await page.route("**/*", route => {
                const type = route.request().resourceType();
                return ["image", "font", "media"].includes(type)
                  ? route.abort()
                  : route.continue();
              });

              const response = await page.goto(portalUrl, {
                waitUntil: "domcontentloaded",
                timeout: 90000
              });

              if (!response) {
                throw new Error("IndianOil portal did not return a main document response.");
              }

              console.log("IndianOil HTTP status:", response.status());
              console.log("Final URL:", page.url());

              if (!response.ok()) {
                throw new Error(`IndianOil portal returned HTTP ${response.status()}.`);
              }

              if (new URL(page.url()).hostname !== "cx.indianoil.in") {
                throw new Error("Navigation left the expected IndianOil portal host.");
              }

              await page.waitForLoadState("domcontentloaded");
              const bodyText = await page.locator("body").innerText({ timeout: 30000 }).catch(() => "");
              if (bodyText.trim().length < 20) {
                throw new Error("Portal response loaded but its page body appears empty.");
              }

              console.log("PASS: IndianOil portal responded and rendered a non-empty page.");
              console.log("Page title:", await page.title());
              console.log("Note: This is a connectivity check, not a login or subsidy-data test.");
            } finally {
              if (browser) await browser.close();
            }
          })().catch(error => {
            console.error("IndianOil portal test failed:", error.message);
            process.exitCode = 1;
          });
          NODE
